name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_CACHE_VERSION: v4
  VCPKG_COMMIT: bf19794383e8fb95eba5aa553235bc8ec2271688
  QT_VERSION: 6.8.3

jobs:
  docs:
    name: Docs and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project assets
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/architecture/mvideo-architecture.png
          test -s docs/sql/schema.sql
          test -s docs/sql/smoke.sql
          grep -q 'docs/architecture/mvideo-architecture.png' README.md

      - name: Verify vcpkg manifests
        shell: bash
        run: |
          set -euo pipefail
          for manifest in GetServer/vcpkg.json ChatServer1/vcpkg.json StatusServer/vcpkg.json; do
            test -s "$manifest"
            python3 -m json.tool "$manifest" > /dev/null
          done

      - name: Check for accidental secrets
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch VarifyServer/config.json >/dev/null 2>&1; then
            echo "::error::VarifyServer/config.json must never be tracked by Git."
            exit 1
          fi

          if grep -RInE '(password|passwd|secret)[[:space:]]*=[[:space:]]*[^<[:space:]]+' README.md docs; then
            echo "::error::Possible plaintext secret found in documentation."
            exit 1
          fi

  database:
    name: Database schema
    needs: docs
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: MVideo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply schema
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -proot < docs/sql/schema.sql

      - name: Verify tables
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker exec -i "$MYSQL_CONTAINER" mysql -uroot -proot -N -e "SELECT table_name FROM information_schema.tables WHERE table_schema='MVideo' ORDER BY table_name")"
          expected="chat_message chat_message_read chat_thread group_chat group_chat_member private_chat user user_follow user_info"
          for table in $expected; do
            if ! grep -qx "$table" <<< "$actual"; then
              echo "Missing table: $table"
              echo "$actual"
              exit 1
            fi
          done
          echo "$actual"

      - name: Smoke insert
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -proot < docs/sql/smoke.sql

  servers:
    name: server (${{ matrix.project }}, ${{ matrix.platform.name }})
    needs: docs
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        project: [GetServer, ChatServer1, StatusServer]
        platform:
          - name: linux-gcc
            os: ubuntu-latest
            generator: Ninja
            triplet: x64-linux
          - name: windows-msvc
            os: windows-latest
            generator: ""
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg tool
        id: vcpkg-tool
        uses: actions/cache/restore@v4
        with:
          path: .cache/vcpkg/tool
          key: vcpkg-tool-${{ runner.os }}-${{ env.VCPKG_COMMIT }}

      - name: Restore vcpkg packages
        id: vcpkg-pkgs
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/vcpkg/downloads
            .cache/vcpkg/bincache
          key: vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ matrix.project }}-${{ env.VCPKG_CACHE_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles(format('{0}/vcpkg.json', matrix.project)) }}
          restore-keys: |
            vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ matrix.project }}-${{ env.VCPKG_CACHE_VERSION }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ env.VCPKG_CACHE_VERSION }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ matrix.project }}-
            vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-

      - name: Setup vcpkg
        shell: bash
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            WORKSPACE_POSIX="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            WORKSPACE_POSIX="$GITHUB_WORKSPACE"
          fi

          mkdir -p "$WORKSPACE_POSIX/.cache/vcpkg"
          VCPKG_ROOT_POSIX="$WORKSPACE_POSIX/.cache/vcpkg/tool"
          if [ ! -d "$VCPKG_ROOT_POSIX/.git" ]; then
            mkdir -p "$VCPKG_ROOT_POSIX"
            git -C "$VCPKG_ROOT_POSIX" init
            git -C "$VCPKG_ROOT_POSIX" remote add origin https://github.com/microsoft/vcpkg.git
          fi

          git -C "$VCPKG_ROOT_POSIX" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT_POSIX" checkout --force --detach FETCH_HEAD

          if [ ! -x "$VCPKG_ROOT_POSIX/vcpkg" ] && [ ! -x "$VCPKG_ROOT_POSIX/vcpkg.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              cmd.exe //c "$(cygpath -w "$VCPKG_ROOT_POSIX/bootstrap-vcpkg.bat") -disableMetrics"
            else
              chmod +x "$VCPKG_ROOT_POSIX/bootstrap-vcpkg.sh"
              "$VCPKG_ROOT_POSIX/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi

          if [ -x "$VCPKG_ROOT_POSIX/vcpkg" ]; then
            VCPKG_BIN="$VCPKG_ROOT_POSIX/vcpkg"
          elif [ -x "$VCPKG_ROOT_POSIX/vcpkg.exe" ]; then
            VCPKG_BIN="$VCPKG_ROOT_POSIX/vcpkg.exe"
          else
            echo "::error::vcpkg executable not found under $VCPKG_ROOT_POSIX"
            exit 1
          fi

          mkdir -p "$WORKSPACE_POSIX/.cache/vcpkg/downloads" "$WORKSPACE_POSIX/.cache/vcpkg/bincache"
          DOWNLOADS_DIR="$GITHUB_WORKSPACE/.cache/vcpkg/downloads"
          BINARY_DIR="$GITHUB_WORKSPACE/.cache/vcpkg/bincache"

          {
            echo "VCPKG_ROOT_POSIX=$VCPKG_ROOT_POSIX"
            echo "VCPKG_BIN=$VCPKG_BIN"
            echo "VCPKG_DOWNLOADS=$DOWNLOADS_DIR"
            echo "VCPKG_BINARY_SOURCES=clear;files,$BINARY_DIR,readwrite"
            echo "VCPKG_BUILD_TYPE=release"
          } >> "$GITHUB_ENV"

          echo "vcpkg root: $VCPKG_ROOT_POSIX"
          echo "vcpkg commit: $VCPKG_COMMIT"
          echo "vcpkg downloads: $DOWNLOADS_DIR"
          echo "vcpkg binary cache: $BINARY_DIR"
          "$VCPKG_BIN" version
          cmake --version

      - name: Select GCC
        if: matrix.platform.name == 'linux-gcc'
        shell: bash
        run: |
          set -euo pipefail
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
          gcc --version | head -n 1
          g++ --version | head -n 1
          ninja --version

      - name: Install vcpkg dependencies
        id: vcpkg-install
        env:
          VCPKG_MAX_CONCURRENCY: 2
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_BIN" install \
            --x-manifest-root="${{ matrix.project }}" \
            --triplet "${{ matrix.platform.triplet }}" \
            --clean-buildtrees-after-build \
            --clean-packages-after-build 2>&1 | tee "vcpkg-install-${{ matrix.project }}.log"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          if command -v cygpath >/dev/null 2>&1; then
            TOOLCHAIN="$(cygpath -w "$VCPKG_ROOT_POSIX/scripts/buildsystems/vcpkg.cmake")"
          else
            TOOLCHAIN="$VCPKG_ROOT_POSIX/scripts/buildsystems/vcpkg.cmake"
          fi

          GEN_ARGS=()
          if [ -n "${{ matrix.platform.generator }}" ]; then
            GEN_ARGS=(-G "${{ matrix.platform.generator }}")
          fi

          cmake -S "${{ matrix.project }}" -B "build-${{ matrix.project }}" "${GEN_ARGS[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.platform.triplet }} \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/${{ matrix.project }}/vcpkg_installed"

      - name: Build
        shell: bash
        run: cmake --build "build-${{ matrix.project }}" --config Release --parallel 2

      - name: Publish vcpkg failure summary
        if: failure() && steps.vcpkg-install.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### vcpkg install failed: ${{ matrix.project }}"
            echo '```text'
            tail -n 200 "vcpkg-install-${{ matrix.project }}.log" || true
            echo '```'
            for f in $(ls -t "$VCPKG_ROOT_POSIX"/buildtrees/*/*out.log "$VCPKG_ROOT_POSIX"/buildtrees/*/*err.log 2>/dev/null | head -n 4); do
              echo "#### $f"
              echo '```text'
              tail -n 120 "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare vcpkg cache directories
        if: always() && steps.vcpkg-install.outcome != 'skipped'
        shell: bash
        run: mkdir -p .cache/vcpkg/downloads .cache/vcpkg/bincache

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-install.outcome == 'success' && steps.vcpkg-pkgs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cache/vcpkg/downloads
            .cache/vcpkg/bincache
          key: vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ matrix.project }}-${{ env.VCPKG_CACHE_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles(format('{0}/vcpkg.json', matrix.project)) }}

      - name: Save vcpkg packages after failure
        if: always() && steps.vcpkg-install.outcome == 'failure'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cache/vcpkg/downloads
            .cache/vcpkg/bincache
          key: vcpkg-pkgs-${{ runner.os }}-${{ matrix.platform.triplet }}-${{ matrix.project }}-${{ env.VCPKG_CACHE_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles(format('{0}/vcpkg.json', matrix.project)) }}-failed-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg tool
        if: always() && steps.vcpkg-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/vcpkg/tool
          key: vcpkg-tool-${{ runner.os }}-${{ env.VCPKG_COMMIT }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform.triplet }}
          path: |
            build-${{ matrix.project }}/${{ matrix.project }}
            build-${{ matrix.project }}/Release/${{ matrix.project }}.exe
            build-${{ matrix.project }}/**/${{ matrix.project }}.exe
          if-no-files-found: error
          retention-days: 7

  client:
    name: client (${{ matrix.platform.name }})
    needs: docs
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-gcc
            os: ubuntu-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Qt build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: qtmultimedia

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          GEN_ARGS=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            GEN_ARGS=(-G Ninja)
          fi

          cmake -S MVideoClient -B build-client "${GEN_ARGS[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DMVIDEO_CLIENT_DEPLOY_QT=OFF

      - name: Build
        shell: bash
        run: cmake --build build-client --config Release --parallel 2

      - name: Upload client binary
        uses: actions/upload-artifact@v4
        with:
          name: MVideoClient-${{ matrix.platform.name }}
          path: |
            build-client/MVideoClient
            build-client/Release/MVideoClient.exe
          if-no-files-found: error
          retention-days: 7

  verify-server:
    name: VarifyServer (Node.js)
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VarifyServer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate example config
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config.example.json','utf8'));if(!c.email||!c.mysql||!c.redis){throw new Error('Invalid example config')};console.log('config.example.json is valid')"

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
