name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify architecture asset
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/architecture/mvideo-architecture.png
          grep -q 'docs/architecture/mvideo-architecture.png' README.md

      - name: Check for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(password|passwd|secret)[[:space:]]*=[[:space:]]*[^<[:space:]]+' README.md docs; then
            echo "Possible plaintext secret found."
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: docs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: Ninja
            triplet: x64-linux
          - os: windows-latest
            generator: Visual Studio 17 2022
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect server sources
        id: detect
        shell: bash
        run: |
          if [ -f server/GetServer/CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build skipped::server/GetServer/CMakeLists.txt is not in the repository yet."
          fi

      - name: Setup vcpkg and dependencies
        if: steps.detect.outputs.present == 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'server/GetServer/vcpkg.json'

      - name: Configure
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_BASE="${VCPKG_ROOT:-$VCPKG_INSTALLATION_ROOT}"
          cmake -S server/GetServer -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_BASE/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Upload binary
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GetServer-${{ matrix.triplet }}
          path: |
            build/GetServer
            build/Release/GetServer.exe
            build/**/GetServer.exe
          if-no-files-found: ignore
          retention-days: 7
